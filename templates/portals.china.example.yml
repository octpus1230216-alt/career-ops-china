# ── 发布时效过滤（可选）──────────────────────────────────────────────
# 只保留近 15 天发布的岗位。provider 不提供发布日期的岗位不会被跳过
# （「不惩罚缺数据」原则）。设为 0 或删掉即关闭。
max_posting_age_days: 15

# ── 标题过滤 ────────────────────────────────────────────────────────
# 命中规则：至少 1 个 positive 命中，且 0 个 negative 命中（大小写不敏感）。
# 匹配细节：
#   - 2-3 个字母的词（"AI"/"ML"）自动按整词匹配，不会命中 "Maintenance" 里的 AI
#   - 4 个字母以上按子串匹配（"Agent" 也会命中 "Agentic"，符合预期）
#   - 前缀 word: 全词匹配；stem: 只锚左边界
#   - " + " 要求多个词同时出现（任意顺序）
title_filter:
  positive:
    # -- 你的核心岗位方向 --
    - "解决方案"
    - "售前"
    - "Presales"
    - "Pre-sales"
    - "Solutions"
    - "Solution"
    - "Forward Deployed"
    - "解决方案架构"
    - "SA"
    # -- AI / 大模型 --
    - "Agent"
    - "AI"
    - "大模型"
    - "RAG"
    - "rag"
    - "工作流"
    - "workflow"
    - "vibecoding"
    # -- 商业化 / 生态 / 客户 --
    
    - "To B"
    - "ToB"
    - "政企"
    - "BD"
    - "商业化"
    - "国央企"
    - "部委"
  negative:
    # -- 级别不符 --
    - "实习"
    - "应届"
    - "兼职"
    - "校园"
    - "培训生"
    - "Trainee"
    - "校招"
    - "senior"
    # -- 职能不符 --
    - "电话销售"
    - "电销"
    - "BPO"
    - "数据标注"
    - "标注"
    - "客服"
    - "外包"
    - "众包"
    - "运营助理"
    - "内容审核"
    - "审核专员"
    # -- 整词锚定：避免 "Intern" 误伤 "Internal" / "International" --
    - "word:Intern"
    - "word:Interns"
    - "Internship"
# ── 内容过滤（职位描述正文，可选）────────────────────────────────────
# 读 JD 正文，而不是只看标题。适合「标题宽泛但方向不符」的岗位。
# 注意：只有 list 接口免费返回 description 的 provider 才有信号；
#      没有 description 的岗位一律放行（不会被静默丢弃）。
# 已开启：确保"解决方案/AI"的岗位真的提到 ToB / 大模型 / 交付。
content_filter:
  positive:
    - "大模型"
    - "LLM"
    - "人工智能"
    - "AI"
    - "机器学习"
    - "解决方案"
    - "To B"
    - "ToB"
    - "企业客户"
    - "政企"
    - "交付"
    - "客户成功"
    - "产品经理"
    - "FDE（应用项）"
    - "客户成功"
    - "商业化"

# ── 国家准入过滤（可选）──────────────────────────────────────────────
# 很多美国公司把远程岗标成 "Remote"，真实准入限制只写在 JD 正文里。
# 这里读正文，命中 exclusionary 且未命中 inclusive 的岗位被拒。
country_eligibility_filter:
  exclusionary:
    - "must be located in the united states"
    - "us-based candidates only"
    - "authorized to work in the us without sponsorship"
    - "must reside in the united states"
    - "only candidates located in the us"
    - "eligible to work in the united states"
  inclusive:
    - "united states or canada"
    - "north america"
    - "canada eligible"
    - "asia"
    - "apac"
    - "global"

# ── 信任过滤（可选）────────────────────────────────────────────────
# 给每个岗位打 0-100 信任分并标注风险，但从不丢弃岗位。
trust_filter:
  enabled: true
  suspicious_domains:
    - "bit.ly"
    - "tinyurl.com"
    - "t.co"
    - "forms.gle"
    - "goo.gl"
    - "shorturl.at"

# ── WebSearch 广撒网（第 4 层策略）──────────────────────────────────
# 每条触发一次搜索，靠上面的 location_filter 兜住「北京 / 真全球远程」。
# 定向中国市场的三条默认启用；欧美板保留但禁用（对你的准入价值低）。
search_queries:
  # -- 中国市场定向（启用）--
