# Portal Scanner Configuration — 中国市场搭桥示例（合并版）
# Used by /career-ops scan to discover new offers automatically.
#
# ┌─ 这份文件是什么 ────────────────────────────────────────────────
# │ 中国 ATS / 外部招聘 CLI 桥接进 career-ops 的**完整可复用示例**：
# │ 以真实中国定向配置为主体（tracked_companies / cn_sources / location_filter
# │ 等），保留各中国 ATS provider 的写法与踩坑注释。复制成仓库根 portals.yml 即可改。
# │
# ├─ 中国 ATS 写法速查（详见各块内联注释 + docs/local-parser-cookbook.md）──
# │   • MokaHR 社招：app.mokahr.com/social-recruitment/<org-slug>/<orgId>
# │   • 飞书招聘：    <公司短名>.jobs.feishu.cn（字节 jobs.bytedance.com 也走此 provider）
# │   • 自建 ATS：   careers.tencent.com / zhaopin.meituan.com / talent.alibaba.com（有专用 provider）
# │   • CLI 桥接：   scan_method: local_parser + parser.script，输出 jobs-json-v1
# │   • 多源聚合：   cn_sources（采集脚本写缓存）+ job_boards 只读缓存（采集与扫描解耦）
# │
# ├─ 与上游通用模板的关系 ──────────────────────────────────────────
# │   欧美通用公司 / search_queries 目录 / 全球招聘板目录见同目录
# │   portals.example.yml（2975 行，本文件未并入）。需要时把对应条目复制进下面
# │   各块的 /* 占位 */ 处即可 —— 见文件末尾 § 可选并入区（勿删，留编辑空间）。
# │
# ├─ 桥接脚本 & 第三方 CLI 位置 ────────────────────────────────────
# │   本示例引用的胶水脚本（cn_bridge / cache reader / enrich / jobhunt_bridge）与
# │   第三方 CLI 钉版副本（Hiring-Radar、job-pro）**已随仓库提供**，都在
# │   integrations/cn/ 下（安装/运行见 integrations/cn/README.md，第三方署名见 NOTICE.md）。
# │   运行时产物 data/cn-jobs.json、data/cn-cache 仍属用户层、被 gitignore。
# │   仅用原生 provider 的公司（飞书 / MokaHR / 腾讯…）不依赖这些脚本，开箱即可扫。
# └────────────────────────────────────────────────────────────────
#
# 目标（用户定义）：
#   1. 北京岗位 —— 主战场
#   2. 全球可远程岗位 —— 点缀（真·不限地域，不含 "Remote - US/EMEA" 这类区域锁定）
#
# 本文件的分层原则（改之前请先读）：
#   - 值可以随便改：关键词表、公司条目、enabled、max_pages、notes
#   - 键名不能改：顶层块名（title_filter / tracked_companies ...）写死在代码里
#   - provider 的值只能取 providers/*.mjs 里已有的 id（见 docs/SUPPORTED_JOB_BOARDS.md）
#   - 不写 provider 更好：代码会从 careers_url 自动识别（greenhouse/ashby/lever/...）
#   - 改完必须跑：node validate-portals.mjs         （结构校验，0 errors 才算过）
#                 node verify-portals.mjs            （爬取体检，看能不能真爬到）
#
# 实测基线演进（每次改动后都跑 verify-portals.mjs）：
#   原始配置          11 live / 0 unresolved
#   2026-10-01 v1     17 live / 0 unresolved
#   2026-10-01 v2     25 live / 0 unresolved   ← 当前
#
# 本版相对上一版的改动（详见文件末尾 § 变更记录）：
#   1. 新增 8 家公司（7 家国内 AI 独角兽 + 理想汽车），全部实测可爬
#   2. 标题过滤器放宽一档（加 Engineer/Manager/Lead 等通用职能词）+ 技术岗噪声对冲
#   3. 修复严重漏洞：区域锁定远程的「逗号形态」("Remote, EMEA") 此前漏网
#   4. 补 90+ 美国城市/州名 + 非洲/中东地名（Ashby 会把地址折进 location）
#   5. 澄清 Cursor/Harvey/Snowflake 当前 0 条可投的原因（锁区域或已过期）


# ── 扫描历史去重策略（可选）────────────────────────────────────────
# 默认：scan-history.tsv 里记录过的 URL 永久去重。
# 有些岗位会重新发布，30 天后允许再次进入管道。
scan_history:
  recheck_after_days: 30
  # 地点纳入去重比较：同一公司在不同城市开的同名岗位算两个岗位。
  # 你的准入是「北京 or 远程」，城市是硬边界，所以开启。
  dedup_include_location: true

# ── 地点过滤（核心）────────────────────────────────────────────────
# 语义（大小写不敏感的子串匹配，按此顺序）：
#   1. location 为空 → 放行（不惩罚缺数据）
#   2. 命中 block_hard → 一票否决（always_allow 也救不回来）
#   3. 命中 always_allow → 放行（覆盖 block）
#   4. 命中 block → 拒绝
#   5. allow 为空 → 放行；allow 非空 → 必须命中至少一个
#
# 注意：location_filter 没有 enabled 字段，靠「这个块存在」启用。
#      （只有 visa_filter 和 trust_filter 认 enabled）
location_filter:
  # 北京写法 + 真·全球远程强信号
  always_allow:
    - "北京"
    - "北京市"
    - "Beijing"
    - "BJ"
    - "Remote, Global"
    - "Remote - Global"
    - "Global Remote"
    - "Worldwide"
    - "Anywhere"
  # 岗位 location 必须命中下列之一才进管道
  allow:
    - "北京"
    - "Beijing"
    - "BJ"
    - "Remote"
    - "remote"
    - "远程"
  # 一票否决：区域锁定的「远程」——这类岗位你在中国投不了。
  # 说明：招聘里的 "Remote" 95% 是「某国境内远程」。
  # 重要：block_hard 只匹配 location 字段；当 location 为空（= "N/A"）时
  #       scan 会直接放行、根本不查这一层。所以 location 为空的板岗（如 HN、
  #       部分 Ashby 板岗）只能靠禁用该板来堵，配置层拦不住。
  # 本层覆盖三种写法：短横线 "Remote - US"、逗号 "Remote, EMEA"、括号 "Remote (Europe)"，
  # 以及裸区域词（"USA only"、"North America & Europe"、(Americas) 等）。
  block_hard:
