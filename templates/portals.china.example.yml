  #    - 面壁 → 走 modelbest.jobs.feishu.cn（上面已收）
  #    - 阶跃 → 走 app.mokahr.com/.../step/94906（上面已收）


# ── 公司别名归一（跨源同司不同名时合并去重键）─────────────────────
# 格式：{ 规范名: [别名, ...] }。scan.mjs 与 cn_bridge 都按此归一公司名，
# 使同一公司在 Hiring-Radar / job-pro / 原生 provider 下的不同写法折叠为
# 同一去重键。未知名按小写原文透传，不影响没登记的条目。
company_aliases:
  ByteDance: ["字节跳动", "字节", "bytedance"]
  Tencent: ["腾讯", "tencent"]
  Alibaba: ["阿里巴巴", "阿里", "alibaba"]
  Meituan: ["美团", "meituan"]
  DeepSeek: ["深度求索", "deepseek"]
  "Moonshot AI": ["月之暗面", "kimi", "moonshot"]
  "Zhipu AI": ["智谱", "智谱 ai", "zhipu"]
  MiniMax: ["稀宇极智", "minimax"]
  Baichuan: ["百川智能", "百川", "baichuan"]
  "01.AI": ["零一万物", "yi", "01ai"]
  StepFun: ["阶跃星辰", "阶跃", "step", "stepfun"]
  ModelBest: ["面壁智能", "面壁", "modelbest"]
  Shengshu: ["生数科技", "生数", "shengshu"]
  Infinigence: ["无问芯穹", "无问", "infinigence"]
  SenseTime: ["商汤科技", "商汤", "sensetime"]
  NIO: ["蔚来", "nio"]
  Momenta: ["momenta"]
  "Li Auto": ["理想汽车", "理想", "lixiang", "liauto"]

# ── 中国岗位外部 CLI 源（Hiring-Radar + job-pro）───────────────────
# 这两个源都不直接进 job_boards 跑：由 integrations/cn/scripts/cn_bridge.mjs 采集、
# 差集调度、按唯一键去重后落到 data/cn-jobs.json 缓存；scan.mjs 只通过下面
# job_boards 里的只读 local-parser 读缓存（见文件末尾 cn-jobs 条目）。
# scan.mjs 本身不读这个顶层块——它是 cn_bridge.mjs 的唯一配置来源。
# 采集命令（带外刷新缓存，scan 绝不跑这些重 CLI）：
#   node integrations/cn/scripts/cn_bridge.mjs            采集→去重→写 data/cn-jobs.json
#   node integrations/cn/scripts/cn_bridge.mjs --dry-run  只报告，不写文件
#   node integrations/cn/scripts/cn_bridge.mjs --json     机器可读摘要
#   node integrations/cn/scripts/cn_bridge.mjs --check    就绪体检（不写文件）：逐项探测
#       python/npx、hiring_radar.py 是否存在、pycryptodome、Chrome、缓存、
#       以及 job_boards 只读条目接线；有 FAIL 才非零退出，WARN/INFO 可忽略。
# 两个源都支持的可选键（写在各自块里即可）：
#   dir         命令的工作目录（默认仓库根）——让 hiring_radar.py 待在自己的
#               clone 里，不必复制到根。环境变量覆盖：HIRING_RADAR_DIR / JOB_PRO_DIR
#   timeout_ms  单次命令超时（默认 CN_BRIDGE_TIMEOUT_MS 或 180000）
# hiring_radar 另支持 keywords: [..] → 拼成 `--keyword a,b,c` 提前收窄全量。
cn_sources:
  enabled: true
  cache: data/cn-jobs.json
  dedup:
    unique_key: "{company}|{title_norm}|{location_norm}"
    # 同一唯一键多源命中时保留优先级最高的一条。native=原生 provider（这些
    # 公司在下面 exclude_companies 已整体排除，缓存里不会出现，列在此处仅
    # 为语义完整）；job-pro 精确度高于聚合的 hiring-radar。
    prefer: [native, job-pro, hiring-radar, websearch]
  # 凡 tracked_companies 里已有原生 provider 的中国公司，全部列这里，禁止
  # 两个 CLI 源重复抓取。规则：凡是 tracked_companies 中 provider ∈
  # {feishu-jobs, mokahr, tencent, meituan, alibaba} 或 careers_url 命中中国
  # ATS 域名（*.jobs.feishu.cn / app.mokahr.com / careers.tencent.com /
  # zhaopin.meituan.com / talent.alibaba.com / jobs.bytedance.com /
  # *.zhiye.com）的公司，cn_bridge.mjs 会扫描并自动并入本列表（用规范名，
  # 经 company_aliases 归一）——下面这份是扫描结果的显式快照，便于人工核对。
  exclude_companies:
    - ByteDance
    - DeepSeek
    - Moonshot AI
    - Zhipu AI
    - MiniMax
    - Baichuan
    - 01.AI
    - StepFun
    - ModelBest
    - Shengshu
    - Infinigence
    - SenseTime
    - Tencent
    - Meituan
    - Alibaba
    - NIO
    - Momenta
    - Li Auto
  hiring_radar:
    # 唯一全量入口。本 CLI 无“一次拉全量”的命令：--local <key> 只跑一个解析器，
    # 中国 170 家 = hiring_radar.py --list 里 “--local：N” 那一段的全部 key（由
    # parsers/companies.seed 注入）。故 cn_bridge 会：先 --list 枚举 key，再逐个
    # `--local <key> --json`（--json 出 {source,total,matched,jobs:[...]}，桥接取 jobs
    # 数组、映 15 字段）；单 key 失败（如 Moka 未装 pycryptodome、站点超时）不阻断整轮。
    command: "python3 hiring_radar.py"   # 基础命令；--local/--json 由桥接逐 key 拼接
    companies: all                        # all → 枚举到的全部 key；也可写 [key1, key2]
    dir: integrations/cn/vendor/Hiring-Radar   # 仓库自带钉版副本；或设 HIRING_RADAR_DIR
    # keywords: ["AI", "大模型", "Agent"]  # 可选：拼成 --keyword 跨 170 个解析器预筛（大幅降量）
    # limit: 20                           # 可选：只查前 N 个 key（冒烟测试用；CLI --limit 同效）
    # timeout_ms: 180000                  # 可选：--list 超时
    # per_company_timeout_ms: 60000       # 可选：单 key 超时（默认 60s）
  job_pro:
    # 只补差集：companies: auto-diff → 仅跑 Hiring-Radar 未覆盖的公司。
    # 差集 = (job-pro `list` 的公司) − (Hiring-Radar 已产出的公司)，均按规范名比较。
    command: "npx @ha7ch/job-pro@latest"
    companies: auto-diff
    keywords: ["AI", "大模型", "Agent"]
    scope: all               # job-pro 仅支持 campus / intern / all（“social” 无效，实测报错）
    # ── JD 正文富化（进程内直调，走 integrations/cn/scripts/enrich-details.mjs）─────
    # 旧路径逐条 spawn `npx @ha7ch/job-pro detail <id>`，实测 ~2.8s/条，且那是
    # 进程启动开销不是网络；差集按千计条 → 小时级。现改为每家一个子进程，
    # 在进程内 import dist/<slug>.js 直调 fetchPositionDetail，实测 89–111ms/条。
    fetch_details: true                              # false 则只保留元数据行
    enrich_script: integrations/cn/scripts/enrich-details.mjs
    package_root: integrations/cn/vendor/job-pro   # 仓库自带钉版副本；运行依赖需 npm install（见 integrations/cn/README.md）
    enrich_store_dir: data/cn-cache                 # 每家一个续跑 store：jobpro-enriched-<slug>.json
    detail_limit: 0                                   # 每家富化上限（0 = 不限；冒烟可临时设 20）
    detail_concurrency: 3                             # 一般家族并发（硬上限 8）
    moka_concurrency: 2                               # 命中 slow_families 的家族降到此并发
    slow_families: [moka]                             # 按 dist/<slug>.js 的 import 自动判定家族（实测 ~700ms/条）
    detail_jitter_ms: 200                             # 每条之间 0-Nms 随机抖动，避免贴脸请求
    jd_max_age_days: 14                               # 正文新鲜期：store 里 fetched_at 在期内则跳过，不重打上游
    detail_retries: 2                                 # 失败重试次数（指数退避；429 退避下限更长并额外冷却）
    checkpoint_every: 20                              # 子进程每 N 条原子落盘一次 store（中断可续跑）
    detail_timeout_ms: 30000                          # 单条上限（客户端侧 race，不改上游函数签名）
    enrich_timeout_ms: 900000                         # 单家子进程整体上限（15 分钟）
    # dir: .                        # 可选：命令工作目录（npx 全局装通常不需要）
    # timeout_ms: 180000            # 可选

# ── 招聘板 / 聚合站 ─────────────────────────────────────────────────
# 一个条目 = 一个多雇主平台。同款 title/location 过滤与去重照常生效。
job_boards:

  # ── 中国岗位缓存（只读 local-parser，喂 scan.mjs）─────────────────
  # 由 integrations/cn/scripts/cn_bridge.mjs 采集/去重后写入 data/cn-jobs.json；本条目
  # 仅用只读 local-parser 把缓存原样吐给 scan，绝不重跑任何外部 CLI。
  # 岗位级过滤（title/location/content）与去重仍由 scan.mjs 统一执行。
  - name: 中国岗位缓存 (cn-jobs)
    scan_method: local_parser
    parser:
      command: node
      script: integrations/cn/scripts/cn_cache_reader.mjs
      format: jobs-json-v1
      timeout_ms: 60000
      # 全量缓存可达 ~2 万行、reader 一次吐 ~30MB；local-parser 默认
      # max_buffer_bytes 仅 2MB，会撞 ENOBUFS 导致本板返回 0 条。这里按 provider
      # 自身支持的数据配置（providers/local-parser.mjs 读 parser.max_buffer_bytes）
      # 把上限抬到 128MB，无需改系统层 provider。
      max_buffer_bytes: 134217728
    enabled: true
    notes: "只读缓存桥接：读 data/cn-jobs.json（Hiring-Radar 全量 + job-pro 差集，已按公司别名与职位唯一键去重、排除原生 provider 中国公司）。采集请用 node integrations/cn/scripts/cn_bridge.mjs 刷新缓存；缓存为空时本条目输出 0 条、不影响其它源。"

  # -- 波兰市场（模板自带，对你的准入无价值，保留禁用）--
  - name: SolidJobs IT
    careers_url: https://solid.jobs/public-api/offers/it?campaign=career-ops
    provider: solidjobs
    enabled: false
    notes: "波兰 IT 板。原本启用但实测 500 条全在波兰，对北京准入零价值，已禁用。"

  # ── 全球远程聚合板（provider 直连，scan.mjs 自动跑）──────────────
  # 这些板全部远程岗，location 字段标了区域。靠上面的 location_filter +
  # block_hard（Remote - US / EMEA / APAC 等区域锁定全部拦掉）只留真全球远程。
  # 这是样例 search_queries 想覆盖、但 scan 不读 search_queries 的"替代实现"。

  - name: RemoteOK
    provider: remoteok
    enabled: true
    notes: "全板 feed（latest ~100）。实测 99 条里 63 条命中 AI/产品/运营。location 如 'Remote - US' / 'Worldwide'。"

  - name: WeWorkRemotely
    provider: weworkremotely
    enabled: false
    notes: "全板 RSS。但从数据中心 IP 被 Cloudflare 403（浏览器 UA 直连也 403），环境层无解，禁用。需要时换住宅代理或本地跑。"

  - name: Himalayas
    provider: himalayas
    enabled: true
    notes: "全板 feed（himalayas.app）。locationRestrictions 带区域。"

  - name: Remotive
    provider: remotive
    enabled: true
    notes: "全板 feed。candidate_required_location 如 'Remote, USA' / 'Anywhere'。"

  - name: Working Nomads
    provider: workingnomads
    enabled: true
    notes: "全板 feed。location 如 'Remote' / 'Worldwide'。"

  - name: Hacker News — Who is Hiring
    provider: hackernews
    enabled: false
    notes: "HN 月度招聘帖。location 恒为空，而 scan 的 location_filter 对空 location 直接放行、不查 block_hard（标题里的 '(Americas)'/'USA only' 拦不住）→ 区域锁定岗大量漏网。已禁用；要启用需本地跑并人工筛。"

